$('#menu').onclick=()=>{const o=$('#pill').classList.toggle('open');$('#menu').setAttribute('aria-expanded',o)};
links.forEach(a=>a.onclick=()=>$('#pill').classList.remove('open'));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
['home','about','education','experience','skills','works','contact'].forEach(id=>io.observe($('#'+id)));

$('#f').onsubmit = async ev => {
  ev.preventDefault();
  const n = $('#n').value.trim(), e = $('#e').value.trim(), m = $('#m').value.trim();
  let ok = true;
  const set = (id, t) => { $(id).textContent = t; if (t) ok = false; };
  
  set('#en', n ? '' : 'Enter your name.');
  set('#ee', !e ? 'Enter your email.' : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e) ? '' : 'Enter a valid email address.');
  set('#em', m.length >= 10 ? '' : 'Write a message of at least 10 characters.');
  
  if (!ok) return;

  $('#fs').textContent = 'Sending message...';

  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: n, email: e, message: m })
    });

    if (res.ok) {
      $('#fs').textContent = 'Shukriya! Aap ka message send ho gaya hai.';
      $('#f').reset();
    } else {
      $('#fs').textContent = 'Error! Message send nahi ho saka.';
    }
  } catch (err) {
    $('#fs').textContent = 'Network error! Dobara koshish karein.';
  }
};
